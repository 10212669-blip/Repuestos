<!-- src/main/resources/templates/bitacora.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Repuestos Motos'"></title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🏍️</div>
                <h2>Tienda de <span>Repuestos</span></h2>
            </div>
            
            <div class="sidebar-user">
                <div class="user-avatar">
                    <span th:text="${usuario.nombreCompleto.charAt(0)}"></span>
                </div>
                <div class="user-info">
                    <p class="user-name" th:text="${usuario.nombreCompleto}"></p>
                    <p class="user-email" th:text="${usuario.email}"></p>
                    <span class="user-status">● En línea</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <p class="nav-title">MENÚ PRINCIPAL</p>
                <ul>
                    <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="/ventas"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
                    <li><a href="/productos"><i class="fas fa-boxes"></i> Inventario</a></li>
                    <li><a href="/clientes"><i class="fas fa-users"></i> Clientes</a></li>
                    <li><a href="/proveedores"><i class="fas fa-truck"></i> Proveedores</a></li>
                    <li><a href="/bitacora"><i class="fas fa-history"></i> Bitácora</a></li>
                    <li><a href="/bitacora" class="active"><i class="fas fa-history"></i> Bitácora</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="/logout" class="btn-logout-sidebar">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content-dashboard">
            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-history"></i> Bitácora del Sistema</h3>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Descripción</th>
                            <th>IP</th>
                            <th>Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${log.idLog}"></td>
                            <td th:text="${log.idUsuario != null ? log.idUsuario : 'N/A'}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${log.accion == 'LOGIN' ? 'badge-success' : 
                                                       log.accion == 'LOGOUT' ? 'badge-warning' : 
                                                       log.accion == 'LOGIN_FALLIDO' ? 'badge-danger' : 'badge-info'}"
                                      th:text="${log.accion}"></span>
                            </td>
                            <td th:text="${log.detalle}"></td>
                            <td th:text="${log.ipOrigen}"></td>
                            <td th:text="${#temporals.format(log.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        </tr>
                        <tr th:if="${logs.isEmpty()}">
                            <td colspan="6" style="text-align: center; padding: 40px; color: #999;">
                                📭 No hay registros en la bitácora
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
