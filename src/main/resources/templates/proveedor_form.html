<!-- src/main/resources/templates/proveedor_form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Repuestos Motos'"></title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🏍️</div>
                <h2>Tienda de <span>Repuestos</span></h2>
            </div>
            
            <div class="sidebar-user">
                <div class="user-avatar">
                    <span th:text="${usuario.nombreCompleto.charAt(0)}"></span>
                </div>
                <div class="user-info">
                    <p class="user-name" th:text="${usuario.nombreCompleto}"></p>
                    <p class="user-email" th:text="${usuario.email}"></p>
                    <span class="user-status">● En línea</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <p class="nav-title">MENÚ PRINCIPAL</p>
                <ul>
                    <li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="/ventas"><i class="fas fa-shopping-cart"></i> Ventas</a></li>
                    <li><a href="/productos"><i class="fas fa-boxes"></i> Inventario</a></li>
                    <li><a href="/productos"><i class="fas fa-tag"></i> Productos</a></li>
                    <li><a href="/clientes"><i class="fas fa-users"></i> Clientes</a></li>
                    <li><a href="/proveedores" class="active"><i class="fas fa-truck"></i> Proveedores</a></li>
                    <li><a href="/bitacora"><i class="fas fa-history"></i> Bitácora</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="/logout" class="btn-logout-sidebar">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content-dashboard">
            <div class="form-container">
                <div class="table-header">
                    <h3><i class="fas fa-truck"></i> <span th:text="${titulo}"></span></h3>
                    <a href="/proveedores" class="btn-add"><i class="fas fa-arrow-left"></i> Volver</a>
                </div>

                <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
                    <input type="hidden" th:field="*{idProveedor}">
                    <input type="hidden" th:field="*{codigoProveedor}">
                    
                    <div class="form-group">
                        <label>Nombre de la Empresa:</label>
                        <input type="text" th:field="*{nombreEmpresa}" required placeholder="Ej: Repuestos Honda SAC">
                    </div>

                    <div class="form-group">
                        <label>RUC:</label>
                        <input type="text" th:field="*{ruc}" placeholder="Ej: 20123456789">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono Empresa:</label>
                            <input type="text" th:field="*{telefonoEmpresa}" placeholder="Ej: 01-555-1234">
                        </div>
                        <div class="form-group">
                            <label>Email Empresa:</label>
                            <input type="email" th:field="*{emailEmpresa}" placeholder="Ej: ventas@empresa.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Dirección:</label>
                        <input type="text" th:field="*{direccion}" placeholder="Ej: Av. Principal 456, Lima">
                    </div>

                    <hr style="margin: 25px 0; border-color: #eee;">

                    <h4 style="color: #555; margin-bottom: 15px;">📞 Contacto Principal</h4>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre de Contacto:</label>
                            <input type="text" th:field="*{contactoNombre}" placeholder="Ej: Carlos Rodríguez">
                        </div>
                        <div class="form-group">
                            <label>Teléfono de Contacto:</label>
                            <input type="text" th:field="*{contactoTelefono}" placeholder="Ej: 987654321">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email de Contacto:</label>
                        <input type="email" th:field="*{contactoEmail}" placeholder="Ej: contacto@empresa.com">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save"><i class="fas fa-save"></i> Guardar</button>
                        <a href="/proveedores" class="btn-cancel"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
